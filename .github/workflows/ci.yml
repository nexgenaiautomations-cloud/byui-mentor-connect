# Required status checks for pull requests into master: lint, typecheck,
# unit tests and a production build. All four run with NO secrets and NO
# database (the DB client falls back to a placeholder URL at build time, and
# every page is rendered on demand), confirmed by building with .env.local
# removed.
#
# Deliberately NOT here: Playwright E2E and the accessibility scanner. They
# need a running server and a seeded, isolated database (a Neon branch), and
# CI must never hold credentials for the production database. Run them
# locally against a disposable branch — see tests/e2e/README.md.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Job name kept so the existing branch-protection "required check" keeps
    # matching; it now also lints and builds.
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Builds must never need real secrets; a missing var must not be
          # papered over with a production value.
          NEXT_TELEMETRY_DISABLED: "1"
