# Required status checks for pull requests into master.
#
# Scope is deliberately limited to what runs correctly with NO secrets and
# NO database: type checking and the unit suite. Both were confirmed green
# on a clean checkout with every env var unset before this workflow was
# wired up as a required check.
#
# Deliberately NOT here:
#   * E2E / Playwright and the accessibility scanner — both need a running
#     server and a live database. Those are covered by the Vercel preview
#     deployment on each PR, and are run locally before merge. Making them
#     required here would mean either shipping database credentials into CI
#     or a permanently red gate.
#   * `next lint` — removed in Next 16, so the existing `lint` script is
#     broken. Left alone rather than silently swapped for something else.
#   * `next build` — needs environment variables to succeed; the Vercel
#     preview build is the real signal and already blocks nothing else.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
